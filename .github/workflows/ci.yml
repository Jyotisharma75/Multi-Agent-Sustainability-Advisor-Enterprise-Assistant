name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: House style (no em dashes)
        run: python scripts/check_style.py
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, security, retrieval, graph and API tests
        run: pytest -m "not local_model and not live_azure and not evaluation" --cov --cov-report=xml
      - name: Evaluation (golden set thresholds)
        run: pytest -m evaluation
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  local-model:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,local]" --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/base.yaml') }}
      - name: Download the configured local model
        run: python -c "import yaml; from huggingface_hub import snapshot_download; snapshot_download(yaml.safe_load(open('configs/base.yaml'))['llm']['local']['model_id'])"
      - name: Local Hugging Face SQL generation
        run: pytest -m local_model

  image:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sustainability-advisor:ci
          build-args: BAKE_LOCAL_MODEL=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
